<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stages</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<div class="logo">Sanaa.</div>
</header>

<section class="page">
<h2 class="section-title">Mes stages</h2>

<div class="cards">

<div class="card">
<h3>Stage 1</h3>
<p>
Maintenance informatique, développement web,
création de bases de données et assistance utilisateur.
</p>
</div>

<div class="card">
<h3>Stage 2</h3>
<p>
Participation à différents projets informatiques,
correction de bugs et développement d’interfaces.
</p>
</div>

</div>
</section>

<script>

  const cards = document.querySelectorAll('.card');
  
  cards.forEach(card => {
      card.style.opacity = 0;
      card.style.transform = 'translateY(40px)';
      card.style.transition = '0.6s';
  });
  
  window.addEventListener('scroll', () => {
  
      cards.forEach(card => {
  
          const top = card.getBoundingClientRect().top;
  
          if(top < window.innerHeight - 50){
              card.style.opacity = 1;
              card.style.transform = 'translateY(0px)';
          }
      });
  });
  
  </script>

</body>
</html>
